<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DeadlyGamer Portfolio</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0a0a0a;
      color:white;
      overflow-x:hidden;
    }

    header{
      text-align:center;
      padding:70px 20px;
    }

    header h1{
      font-size:5rem;
      color:#b266ff;
      text-shadow:0 0 25px #8a2be2;
      letter-spacing:4px;
    }

    header p{
      margin-top:15px;
      color:#9e9e9e;
      font-size:1.1rem;
    }

    .portfolio{
      width:92%;
      margin:auto;
      padding-bottom:60px;

      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
      gap:30px;
    }

    .card{
      position:relative;
      overflow:hidden;
      border-radius:24px;
      background:#111;
      border:1px solid rgba(255,255,255,0.05);
      transition:0.4s;
      box-shadow:0 0 25px rgba(128,0,255,0.1);
    }

    .card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 40px rgba(178,102,255,0.35);
    }

    .card img{
      width:100%;
      height:420px;
      object-fit:cover;
      display:block;
    }

    .overlay{
      position:absolute;
      bottom:0;
      width:100%;
      padding:25px;
      background:linear-gradient(
        transparent,
        rgba(0,0,0,0.95)
      );
    }

    .overlay h2{
      font-size:1.6rem;
      color:white;
    }

    footer{
      text-align:center;
      padding:30px;
      color:#666;
      border-top:1px solid #1a1a1a;
    }

  </style>

</head>

<body>

  <header>
    <h1>DeadlyGamer Portfolio</h1>
    <p>Gaming Graphics • Neon Aesthetic • Portfolio</p>
  </header>

  <section class="portfolio">

    <div class="card">
      <img src="dark.gif">
      <div class="overlay">
        <h2>Dark Defenders</h2>
      </div>
    </div>

    <div class="card">
      <img src="ir.png">
      <div class="overlay">
        <h2>IR Design</h2>
      </div>
    </div>

    <div class="card">
      <img src="neon.gif">
      <div class="overlay">
        <h2>Neon Sanctuary</h2>
      </div>
    </div>

    <div class="card">
      <img src="ns.png">
      <div class="overlay">
        <h2>NS Cyber Design</h2>
      </div>
    </div>

    <div class="card">
      <img src="valorant.png">
      <div class="overlay">
        <h2>Dark Defenders</h2>
      </div>
    </div>

  </section>

  <footer>
    © 2026 DeadlyGamer
  </footer>

</body>
</html>
